<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Al-Qalam Quran Academy</title>
  <style>
    :root {
      --bg-dark: #022c22;
      --emerald-accent: #059669;
      --gold-accent: #d97706;
      --text-light: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #0f172a 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      max-width: 440px;
      margin: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .arabic-title {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: #fbbf24;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: white;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="arabic-title">مَعَهَدُ الْقَلَمِ</div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection to access live classes and new recitation sessions. Cached pages and offline materials remain accessible.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>

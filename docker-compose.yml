version: '3.8'

services:
  educatech-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SOCKET_PORT=3001
      - DATABASE_URL=file:./data/dev.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-educatech-production-secret-key-123456}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
    volumes:
      - sqlite_data:/app/prisma/data

volumes:
  sqlite_data:
    driver: local
